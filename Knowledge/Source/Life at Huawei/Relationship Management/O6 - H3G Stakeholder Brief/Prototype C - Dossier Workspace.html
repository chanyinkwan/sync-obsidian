<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H3G Stakeholder Dossier Workspace</title>
  <meta name="description" content="H3G 客戶人物檔案：目錄式主從工作台原型">
  <style>
    :root {
      --forest-950: #10231c;
      --forest-900: #173129;
      --forest-800: #23473b;
      --forest-700: #356353;
      --forest-100: #dfeae5;
      --forest-50: #edf4f0;
      --amber-500: #ca8a2b;
      --amber-100: #f6e5c5;
      --ink: #20251f;
      --muted: #667068;
      --paper: #faf9f5;
      --surface: #ffffff;
      --line: #d8ddd7;
      --danger: #9e4237;
      --shadow: 0 18px 52px rgba(18, 35, 28, .11);
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Trebuchet MS", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(16, 35, 28, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 35, 28, .035) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      font-family: var(--sans);
    }

    button, a { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--amber-500);
      outline-offset: 3px;
    }

    .shell {
      width: min(1500px, calc(100% - 32px));
      min-height: calc(100vh - 32px);
      margin: 16px auto;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 82px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: #fff;
      background: var(--forest-950);
      border-bottom: 4px solid var(--amber-500);
    }

    .eyebrow, .section-kicker, .field-label, .record-code, .status-label {
      font-family: var(--mono);
      letter-spacing: .085em;
      text-transform: uppercase;
    }
    .eyebrow { margin: 0 0 5px; color: #b7cbc1; font-size: 11px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); letter-spacing: -.035em; }
    .topbar-meta { color: #d9e5df; font-size: 13px; text-align: right; }
    .topbar-meta strong { color: #fff1d4; }

    .workspace {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: calc(100vh - 118px);
    }

    .directory {
      position: sticky;
      top: 0;
      align-self: start;
      height: calc(100vh - 36px);
      min-height: 620px;
      display: flex;
      flex-direction: column;
      background: var(--forest-900);
      color: #fff;
      border-right: 1px solid var(--forest-950);
    }
    .directory-head { padding: 24px 22px 17px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .directory-head h2 { margin: 3px 0 7px; font-size: 20px; }
    .directory-head p { margin: 0; color: #b9ccc3; font-size: 13px; line-height: 1.5; }
    .section-kicker { color: var(--amber-100); font-size: 10px; }
    .client-list { margin: 0; padding: 10px; overflow: auto; list-style: none; }
    .client-button {
      width: 100%;
      min-height: 72px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 3px;
      color: #e8efeb;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .client-button:hover { background: rgba(255,255,255,.075); }
    .client-button[aria-selected="true"] {
      color: #fff;
      background: var(--forest-800);
      border-left-color: var(--amber-500);
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--forest-950);
      background: var(--amber-100);
      border: 2px solid rgba(255,255,255,.45);
      font: 700 14px var(--mono);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .client-name { display: block; font-weight: 700; line-height: 1.2; }
    .client-title { display: block; margin-top: 4px; color: #aebfb7; font-size: 11px; line-height: 1.3; }
    .badge {
      min-width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.23);
      color: var(--amber-100);
      font: 700 11px var(--mono);
    }
    .directory-foot { margin-top: auto; padding: 15px 22px; color: #abc0b6; border-top: 1px solid rgba(255,255,255,.12); font-size: 11px; }

    .dossier { min-width: 0; background: var(--paper); }
    .pathbar {
      min-height: 48px;
      padding: 9px 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: var(--forest-50);
      white-space: nowrap;
    }
    .path-label { margin-right: 6px; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; }
    .path-node { color: var(--forest-800); font-size: 12px; font-weight: 700; }
    .path-node:last-child { color: var(--ink); }
    .path-separator { color: var(--amber-500); }

    .dossier-inner { max-width: 1120px; margin: 0 auto; padding: 30px; }
    .record-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .record-code { color: var(--forest-700); font-size: 11px; }
    .record-head h2 { margin: 7px 0 8px; font-size: clamp(30px, 5vw, 52px); line-height: 1; letter-spacing: -.05em; }
    .record-title { max-width: 760px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .record-avatar { width: 104px; height: 104px; font-size: 25px; border: 4px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
    .status-stack { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
    .status-pill { min-height: 30px; padding: 6px 10px; display: inline-flex; align-items: center; border-radius: 2px; color: var(--forest-900); background: var(--forest-100); font-size: 12px; font-weight: 700; }
    .status-pill.attitude-support { color: #174a37; background: #dceee5; }
    .status-pill.attitude-neutral { color: #6b4b17; background: var(--amber-100); }
    .status-pill.attitude-unknown { color: #5b625d; background: #e8e9e7; }

    .summary-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; margin-top: 24px; }
    .panel { background: var(--surface); border: 1px solid var(--line); }
    .panel-title { margin: 0; padding: 12px 16px; color: var(--forest-900); background: var(--forest-50); border-bottom: 1px solid var(--line); font: 700 12px var(--mono); letter-spacing: .065em; }
    .panel-body { padding: 17px 18px; }
    .responsibility { margin: 0; color: var(--forest-950); font-size: 19px; line-height: 1.55; font-weight: 700; }
    .concern { margin: 14px 0 0; padding: 12px 14px; color: #6b4711; background: #fff8eb; border-left: 3px solid var(--amber-500); line-height: 1.5; }
    .fact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fact { min-height: 76px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
    .fact:nth-child(odd) { border-right: 1px solid var(--line); }
    .fact:nth-last-child(-n + 2) { border-bottom: 0; }
    .field-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 9px; }
    .field-value { font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }

    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-top: 22px; }
    .span-two { grid-column: 1 / -1; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { min-height: 30px; padding: 6px 9px; display: inline-flex; align-items: center; color: var(--forest-800); background: var(--forest-50); border: 1px solid var(--forest-100); font-size: 12px; }
    .empty { color: #8b928d; font-style: italic; }
    .timeline { position: relative; margin: 0; padding: 0; list-style: none; }
    .timeline::before { content: ""; position: absolute; top: 6px; bottom: 6px; left: 4px; width: 1px; background: var(--line); }
    .timeline li { position: relative; padding: 0 0 14px 23px; font-size: 13px; line-height: 1.48; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li::before { content: ""; position: absolute; top: 5px; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--amber-500); box-shadow: 0 0 0 3px var(--amber-100); }
    .verified { padding: 17px 0 2px; color: var(--muted); font: 10px var(--mono); text-align: right; }

    #record { opacity: 1; transition: opacity 120ms ease; }
    #record.swapping { opacity: .35; }

    @media (prefers-reduced-motion: reduce) { #record { transition: none; } }
    @media (max-width: 900px) {
      .shell { width: 100%; min-height: 100vh; margin: 0; border: 0; }
      .workspace { display: block; }
      .directory { position: static; height: auto; min-height: 0; border-right: 0; }
      .directory-head { padding: 17px 18px 12px; }
      .directory-head p, .directory-foot { display: none; }
      .client-list { display: flex; gap: 8px; padding: 10px 14px 14px; overflow-x: auto; }
      .client-button { width: 210px; min-width: 210px; min-height: 68px; grid-template-columns: 44px minmax(0, 1fr); border-left: 0; border-bottom: 3px solid transparent; }
      .client-button[aria-selected="true"] { border-left-color: transparent; border-bottom-color: var(--amber-500); }
      .client-button .badge { display: none; }
      .pathbar { padding-inline: 18px; }
      .dossier-inner { padding: 24px 18px; }
    }
    @media (max-width: 680px) {
      .topbar { align-items: flex-start; padding: 16px 18px; }
      .topbar-meta { display: none; }
      .record-head { grid-template-columns: minmax(0, 1fr) 72px; gap: 14px; }
      .record-avatar { width: 70px; height: 70px; font-size: 18px; }
      .summary-grid, .detail-grid { grid-template-columns: 1fr; }
      .span-two { grid-column: auto; }
    }
    @media (max-width: 440px) {
      .fact-grid { grid-template-columns: 1fr; }
      .fact, .fact:nth-child(odd), .fact:nth-last-child(-n + 2) { border-right: 0; border-bottom: 1px solid var(--line); }
      .fact:last-child { border-bottom: 0; }
    }
    .confidential { margin: 0; padding: 10px 24px; border-bottom: 1px solid #e7d7b0; background: #fff8e7; color: #79540b; font-size: 12px; font-weight: 800; text-align: center; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CKH IOD · relationship intelligence</p>
        <h1>H3G Stakeholder Dossier</h1>
      </div>
      <div class="topbar-meta"><strong>06</strong> ACTIVE DIRECTORY<br>CURRENT-SCOPE PROTOTYPE</div>
    </header>
    <aside class="confidential" role="note">內部資料｜婚姻、家庭、飲食及興趣資料不得對外分享；對外只可轉化為 relationship development cadence。</aside>

    <div class="workspace">
      <aside class="directory" aria-labelledby="directory-title">
        <div class="directory-head">
          <span class="section-kicker">Client index / 客戶目錄</span>
          <h2 id="directory-title">Stakeholder Directory</h2>
          <p>選取人物以開啟右側檔案。使用 ↑↓ 或 Home／End 快速瀏覽。</p>
        </div>
        <ul class="client-list" id="client-list" role="listbox" aria-label="客戶人物"></ul>
        <div class="directory-foot">D = DECISION CHAIN · I = INFLUENCE LAYER</div>
      </aside>

      <section class="dossier" aria-live="polite">
        <nav class="pathbar" id="pathbar" aria-label="匯報關係路徑"></nav>
        <article id="record"></article>
      </section>
    </div>
  </main>

  <script src="stakeholder-data.js"></script>
  <script>
    (() => {
      "use strict";

      const people = Array.isArray(window.STAKEHOLDERS) ? window.STAKEHOLDERS : [];
      const list = document.getElementById("client-list");
      const record = document.getElementById("record");
      const pathbar = document.getElementById("pathbar");
      const relationshipPaths = {
        fok: ["Canning Fok"],
        dennis: ["Canning Fok", "Dennis Lui"],
        francesco: ["Canning Fok", "Dennis Lui", "Francesco Zampini"],
        agostino: ["Canning Fok", "Dennis Lui", "Francesco Zampini", "Agostino Ruberto"],
        marlene: ["Canning Fok", "Dennis Lui", "Francesco Zampini", "Marlene Fantini"],
        mark: ["Canning Fok", "Dennis Lui", "Francesco Zampini", "Marlene Fantini", "Mark Williams"]
      };
      let activeIndex = Math.max(0, people.findIndex(person => !person.anchorOnly));

      const escapeHtml = value => String(value ?? "未知").replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);

      const avatar = (person, className = "") => {
        const fallback = `<span aria-hidden="true">${escapeHtml(person.initials)}</span>`;
        const image = person.photo
          ? `<img src="${escapeHtml(person.photo)}" alt="" onerror="this.replaceWith(this.nextElementSibling)">${fallback}`
          : fallback;
        return `<span class="avatar ${className}">${image}</span>`;
      };

      const valueOrUnknown = value => value && String(value).trim() ? escapeHtml(value) : '<span class="empty">未知</span>';
      const tags = values => values && values.length
        ? `<div class="tag-list">${values.map(value => `<span class="tag">${escapeHtml(value)}</span>`).join("")}</div>`
        : '<span class="empty">尚未記錄</span>';
      const timeline = values => values && values.length
        ? `<ol class="timeline">${values.map(value => `<li>${escapeHtml(value)}</li>`).join("")}</ol>`
        : '<span class="empty">尚未記錄</span>';
      const fact = (label, value) => `<div class="fact"><span class="field-label">${escapeHtml(label)}</span><div class="field-value">${valueOrUnknown(value)}</div></div>`;

      function renderDirectory() {
        list.innerHTML = people.map((person, index) => `
          <li role="presentation">
            <button class="client-button" id="client-${escapeHtml(person.id)}" type="button" role="option"
              aria-selected="${index === activeIndex}" tabindex="${index === activeIndex ? 0 : -1}" data-index="${index}">
              ${avatar(person)}
              <span><span class="client-name">${escapeHtml(person.name)}</span><span class="client-title">${escapeHtml(person.title)}</span></span>
              <span class="badge" aria-label="層級 ${escapeHtml(person.badge)}">${escapeHtml(person.badge)}</span>
            </button>
          </li>`).join("");
      }

      function renderPath(person) {
        const path = relationshipPaths[person.id] || [person.name];
        pathbar.innerHTML = `<span class="path-label">REPORTING PATH</span>${path.map((name, index) =>
          `${index ? '<span class="path-separator" aria-hidden="true">›</span>' : ''}<span class="path-node">${escapeHtml(name)}</span>`
        ).join("")}`;
      }

      function renderRecord(person) {
        const attitudeClass = person.attitude === "支持" ? "support" : person.attitude === "中立" ? "neutral" : "unknown";
        record.classList.add("swapping");
        const commit = () => {
          record.innerHTML = `
            <div class="dossier-inner">
              <header class="record-head">
                <div>
                  <span class="record-code">RECORD / ${escapeHtml(person.id).toUpperCase()} · LEVEL ${escapeHtml(person.badge)}</span>
                  <h2>${escapeHtml(person.name)}</h2>
                  <p class="record-title">${escapeHtml(person.title)}</p>
                  <div class="status-stack">
                    <span class="status-pill attitude-${attitudeClass}">態度 · ${escapeHtml(person.attitude)}</span>
                    <span class="status-pill">會面 · ${escapeHtml(person.meetingStyle)}</span>
                    ${person.anchorOnly ? '<span class="status-pill">組織錨點</span>' : ''}
                  </div>
                </div>
                ${avatar(person, "record-avatar")}
              </header>

              <div class="summary-grid">
                <section class="panel">
                  <h3 class="panel-title">01 / RESPONSIBILITY & PRIORITIES</h3>
                  <div class="panel-body">
                    <p class="responsibility">${valueOrUnknown(person.responsibility)}</p>
                    <p class="concern"><span class="field-label">KEY CONCERNS / 關注重點</span>${valueOrUnknown(person.keyConcerns)}</p>
                  </div>
                </section>
                <section class="panel">
                  <h3 class="panel-title">02 / RELATIONSHIP FACTS</h3>
                  <div class="fact-grid">
                    ${fact("REPORTS TO / 匯報對象", person.reportsTo)}
                    ${fact("TENURE / 任期", person.tenure)}
                    ${fact("HUAWEI CONTACT / 華為接口", person.huaweiContact)}
                    ${fact("BIRTHDAY / 生日", person.birthday)}
                    ${fact("MARITAL STATUS / 婚姻", person.maritalStatus)}
                    ${fact("FAMILY / 家庭", person.family)}
                  </div>
                </section>
              </div>

              <div class="detail-grid">
                <section class="panel">
                  <h3 class="panel-title">03 / RECENT MEETINGS</h3>
                  <div class="panel-body">${timeline(person.recentMeetings)}</div>
                </section>
                <section class="panel">
                  <h3 class="panel-title">04 / PERSONAL CONTEXT</h3>
                  <div class="panel-body">
                    <span class="field-label">FOOD PREFERENCES / 飲食偏好</span>
                    ${tags(person.foodPreferences)}
                    <span class="field-label" style="margin-top:17px">INTERESTS / 興趣</span>
                    ${tags(person.interests)}
                  </div>
                </section>
                <section class="panel span-two">
                  <h3 class="panel-title">05 / CAREER EXPERIENCE</h3>
                  <div class="panel-body">${timeline(person.career)}</div>
                </section>
              </div>
              <footer class="verified">LAST VERIFIED / ${escapeHtml(person.lastVerified)}</footer>
            </div>`;
          renderPath(person);
          requestAnimationFrame(() => record.classList.remove("swapping"));
        };
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) commit();
        else window.setTimeout(commit, 80);
      }

      function select(index, focus = false) {
        if (!people[index]) return;
        activeIndex = index;
        document.querySelectorAll(".client-button").forEach((button, buttonIndex) => {
          const selected = buttonIndex === activeIndex;
          button.setAttribute("aria-selected", String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
        renderRecord(people[activeIndex]);
        if (focus) document.querySelectorAll(".client-button")[activeIndex]?.focus();
      }

      list.addEventListener("click", event => {
        const button = event.target.closest(".client-button");
        if (button) select(Number(button.dataset.index));
      });
      list.addEventListener("keydown", event => {
        const keys = ["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft", "Home", "End"];
        if (!keys.includes(event.key)) return;
        event.preventDefault();
        if (event.key === "Home") activeIndex = 0;
        else if (event.key === "End") activeIndex = people.length - 1;
        else if (event.key === "ArrowDown" || event.key === "ArrowRight") activeIndex = (activeIndex + 1) % people.length;
        else activeIndex = (activeIndex - 1 + people.length) % people.length;
        select(activeIndex, true);
      });

      if (!people.length) {
        record.innerHTML = '<div class="dossier-inner"><p class="empty">未能載入 stakeholder-data.js。</p></div>';
      } else {
        renderDirectory();
        renderRecord(people[activeIndex]);
      }
    })();
  </script>
</body>
</html>
